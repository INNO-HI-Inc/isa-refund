name: Refresh K-apt data (monthly)

on:
  schedule:
    # 매월 1일 03:00 UTC (한국시간 12:00)
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check secret
        id: check
        run: |
          if [ -z "${{ secrets.DATA_GO_KR_KEY }}" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "DATA_GO_KR_KEY secret이 없어 데이터 갱신을 건너뜁니다 (성공 처리)."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.has_key == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.check.outputs.has_key == 'true'
        run: npm ci

      - name: Fetch K-apt data
        if: steps.check.outputs.has_key == 'true'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        # 트래픽 한도 내에서 매달 300개 단지씩 갱신 (기존 샤드보다 신규 우선)
        run: node scripts/fetch-kapt.mjs --limit 300 --months 24

      - name: Commit changes
        if: steps.check.outputs.has_key == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "변경된 데이터가 없습니다."
          else
            git commit -m "chore(data): refresh K-apt monthly levy data"
            git push
          fi
